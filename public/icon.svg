<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b" />
      <stop offset="50%" stop-color="#fbbf24" />
      <stop offset="100%" stop-color="#d97706" />
    </linearGradient>
    <linearGradient id="tricolorSaffron" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FF9933" />
      <stop offset="100%" stop-color="#FF7700" />
    </linearGradient>
    <linearGradient id="tricolorGreen" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#138808" />
      <stop offset="100%" stop-color="#0e6906" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="16" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background with subtle border -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)" />
  <rect x="6" y="6" width="500" height="500" rx="106" fill="none" stroke="#334155" stroke-width="3" />

  <!-- India Tricolor subtle curved badge banner -->
  <path d="M 120 72 Q 256 96 392 72" fill="none" stroke="url(#tricolorSaffron)" stroke-width="8" stroke-linecap="round" />
  <path d="M 140 86 Q 256 106 372 86" fill="none" stroke="#ffffff" stroke-width="4" stroke-opacity="0.8" stroke-linecap="round" />
  <path d="M 160 98 Q 256 116 352 98" fill="none" stroke="url(#tricolorGreen)" stroke-width="8" stroke-linecap="round" />

  <!-- Shield / Quiz Crest Shape -->
  <path d="M 256 130 C 340 130 380 160 380 250 C 380 340 290 410 256 430 C 222 410 132 340 132 250 C 132 160 172 130 256 130 Z" 
        fill="#1e293b" stroke="url(#goldGrad)" stroke-width="6" stroke-linejoin="round" />

  <!-- Inner Ashoka-chakra / Knowledge Star motif -->
  <circle cx="256" cy="270" r="76" fill="none" stroke="#38bdf8" stroke-width="4" stroke-dasharray="6,4" />
  <circle cx="256" cy="270" r="14" fill="#38bdf8" />

  <!-- Knowledge Quill / Pen Tip -->
  <path d="M 256 170 L 284 250 L 256 295 L 228 250 Z" fill="url(#goldGrad)" filter="url(#glow)" />
  <line x1="256" y1="170" x2="256" y2="280" stroke="#0f172a" stroke-width="3" stroke-linecap="round" />

  <!-- Star accents -->
  <polygon points="256,365 262,380 278,380 265,390 270,405 256,395 242,405 247,390 234,380 250,380" fill="url(#goldGrad)" />
</svg>
